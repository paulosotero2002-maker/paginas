<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMAN — Prontidão 7 de Setembro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#10141A; --bg-elev:#161C24; --surface:#1D2530; --surface-2:#252E3B;
    --border:#303A47; --text:#E7ECF2; --text-dim:#93A0B0; --text-faint:#5C6879;
    --pendente:#5B6472; --aprovada:#34D399; --finalizada:#10B981; --cancelada:#EF5350;
    --semos:#EF5350;
    --amber:#E8A93A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .disp{font-family:'Rajdhani',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px;}

  header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
    padding:20px 22px;background:linear-gradient(135deg,var(--bg-elev),var(--surface));
    border:1px solid var(--border);border-radius:14px;margin-bottom:18px;position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber);}
  .htitle{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
  h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;margin:0;letter-spacing:.01em;}
  .countdown{display:flex;align-items:baseline;gap:8px;background:var(--bg);border:1px solid var(--border);
    border-radius:10px;padding:10px 18px;}
  .countdown .num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:var(--amber);line-height:1;}
  .countdown .lbl{font-size:12px;color:var(--text-dim);line-height:1.2;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .stat .l{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;overflow-x:auto;flex-wrap:nowrap;}
  .tab{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.02em;padding:8px 16px;
    border-radius:7px;cursor:pointer;color:var(--text-dim);border:none;background:transparent;white-space:nowrap;}
  .tab.active{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border);}
  .right-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text], input[type=file]{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:9px 12px;font-family:'Inter',sans-serif;font-size:13.5px;min-width:180px;}
  input[type=text]:focus{outline:1px solid var(--amber);}
  .btn{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:.02em;padding:9px 14px;
    border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .btn:hover{border-color:var(--amber);}
  .btn.primary{background:var(--amber);color:#1a1204;border-color:var(--amber);}
  .btn.ghost{background:transparent;}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--text-dim);margin-bottom:16px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
  .col{min-width:230px;flex:1 1 230px;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;
    padding:10px;max-height:70vh;display:flex;flex-direction:column;}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;border-bottom:2px solid var(--stage-color,var(--border));margin-bottom:8px;}
  .col-head .t{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.02em;color:var(--stage-color);}
  .col-head .c{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);background:var(--surface);
    border-radius:20px;padding:1px 8px;}
  .col-cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;}
  .card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--stage-color);
    border-radius:9px;padding:9px 10px;}
  .card .v{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;}
  .card .os{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:1px;}
  .card .note{font-size:11px;color:var(--text-faint);margin-top:3px;}
  .card .pend-details{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);}
  .card select{margin-top:7px;width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:5px 6px;font-family:'Inter',sans-serif;font-size:11.5px;}
  .empty-col{font-size:12px;color:var(--text-faint);padding:10px 6px;text-align:center;}

  .vg-row{display:grid;gap:10px;align-items:center;background:var(--surface);
    border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px;overflow-x:auto;}
  .vg-v{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15.5px;}
  .vg-cell{display:flex;flex-direction:column;gap:3px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    padding:3px 9px;border-radius:20px;width:fit-content;background:var(--surface-2);border:1px solid var(--border);}
  .pill .dot{width:7px;height:7px;}
  .vg-head{display:grid;gap:10px;padding:0 12px 6px;font-size:11px;
    text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);}

  .addform{display:none;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:12px;margin-bottom:14px;}
  .addform.open{display:flex;}
  .addform input,.addform select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;}
  footer{text-align:center;color:var(--text-faint);font-size:11px;margin-top:24px;}
  .error-box{padding:20px;text-align:center;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;margin:10px 0;}
  .error-box p{margin:5px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="htitle">
      <div class="eyebrow">DEMAN · Controle de Viaturas</div>
      <h1>Prontidão para o Desfile de 7 de Setembro</h1>
    </div>
    <div class="countdown">
      <span class="num" id="countdownNum">—</span>
      <span class="lbl">dias<br>restantes</span>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>

  <div class="toolbar">
    <div class="tabs" id="tabsContainer"></div>
    <div class="right-tools">
      <input type="text" id="search" placeholder="Buscar viatura (ex: AS-20)" aria-label="Buscar viatura">
      <button class="btn" id="addBtn" aria-label="Adicionar nova OS">+ Nova OS</button>
    </div>
  </div>

  <div class="addform" id="addForm">
    <input type="text" id="af-v" placeholder="Viatura (ex: AS-31)" aria-label="Viatura">
    <input type="text" id="af-os" placeholder="Nº da OS" aria-label="Número da OS">
    <input type="text" id="af-cat" placeholder="Categoria (ex: Lavagem)" aria-label="Categoria" style="min-width:140px;">
    <select id="af-stage" aria-label="Estágio"></select>
    <input type="text" id="af-note" placeholder="Observação (opcional)" aria-label="Observação" style="flex:1;min-width:160px;">
    <button class="btn primary" id="af-save" aria-label="Salvar">Salvar</button>
    <button class="btn ghost" id="af-cancel" aria-label="Cancelar">Cancelar</button>
  </div>

  <div id="content"></div>

  <footer>Dados carregados da planilha Google Sheets. Se a carga automática falhar, use o botão abaixo.</footer>

  <div id="errorArea" class="error-box" style="display:none;">
    <p><strong>Não foi possível carregar os dados automaticamente.</strong></p>
    <p>Você pode baixar o CSV da planilha e carregá-lo manualmente:</p>
    <input type="file" id="csvFileInput" accept=".csv" aria-label="Carregar CSV manualmente">
  </div>
</div>

<script>
const DIRECT_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgJLcOwlEwxFzXZvHTcO3HzHabatIpwYQi5kAbPKQERKUzjbCou_6So6I_hQwafxP8Z7M0yhLN5GY7/pub?output=csv';

// ==============================================
// URL DO APPS SCRIPT PARA ATUALIZAR A PLANILHA
// ==============================================
const APPS_SCRIPT_URL = 'COLE_AQUI_A_URL_DO_APPS_SCRIPT';

// ==============================================
const STAGES = [
  {key:'pendente',  label:'Pendente',   color:'var(--pendente)'},
  {key:'aprovada',  label:'Aprovada',   color:'var(--aprovada)'},
  {key:'finalizada',label:'Finalizada', color:'var(--finalizada)'},
  {key:'cancelada', label:'Cancelada',  color:'var(--cancelada)'},
];
const STAGE_IDX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));

function normalizeStr(str){
  return String(str || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function slugify(str){
  const n = normalizeStr(str || '');
  return n.replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'outras';
}

function findField(row, keywords){
  const keys = Object.keys(row || {});
  for (const k of keys) {
    const nk = normalizeStr(k);
    if (keywords.some(kw => nk.includes(kw))) return row[k];
  }
  return '';
}

function parseStage(raw){
  const r = normalizeStr(raw || '');
  if (r.includes('cancelada')) return 'cancelada';
  if (r.includes('entregue') || r.includes('finalizada') || r.includes('concluida')) return 'finalizada';
  if (r.includes('aprovada')) return 'aprovada';
  return 'pendente';
}

function extractPendenteDetails(statusRaw, note, orcadaRaw, qntRaw){
  const r = normalizeStr(statusRaw || '');
  const n = normalizeStr(note || '');
  const o = normalizeStr(orcadaRaw || '');
  const combined = r + ' ' + n;
  let orcamentos = 0;

  const qntNum = parseInt(qntRaw, 10);
  if (o && (o === 'sim' || o === 'true' || o === '1' || o === 'x' || o === 'yes' || /or/i.test(o))) {
    orcamentos = qntNum > 0 ? qntNum : 1;
  } else {
    const match = combined.match(/(\d+)\s*\/\s*5/) || combined.match(/(\d+)\s*de\s*5/) || combined.match(/or[çc]ada\s+(\d+)/i);
    if (match) {
      orcamentos = parseInt(match[1], 10);
    } else if (r.includes('orçada') || r.includes('orcada') || r.includes('cotada')) {
      orcamentos = 1;
    }
  }
  if (orcamentos > 5) orcamentos = 5;

  const tabela = combined.includes('tabela');
  const justificativa = combined.includes('justificativa');

  return { orcamentos, tabela, justificativa };
}

let DATA = [];
let activeTab = 'geral';

function saveLocal(){
  try { localStorage.setItem('deman_data_v1', JSON.stringify(DATA)); } catch(e){}
}
function loadLocal(){
  try {
    const d = JSON.parse(localStorage.getItem('deman_data_v1'));
    if (Array.isArray(d) && d.length) {
      DATA = d.map(r => {
        const oldStage = r.stage;
        if (oldStage === 'aprovada') r.stage = 'aprovada';
        else if (oldStage === 'concluida' || oldStage === 'execucao') r.stage = 'finalizada';
        else if (oldStage === 'cancelada') r.stage = 'cancelada';
        else r.stage = 'pendente';
        if (!r.orcamentos) r.orcamentos = 0;
        if (!r.tabela) r.tabela = false;
        if (!r.justificativa) r.justificativa = false;
        return r;
      });
    }
  } catch(e){}
}

function processCsvText(csvText){
  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  if (parsed.errors && parsed.errors.length) console.warn('CSV parse warnings:', parsed.errors);
  const rows = parsed.data || [];
  DATA = mapRowsToData(rows);
  saveLocal();
  render();
}

function mapRowsToData(rows){
  return rows.map((row, i) => {
    const rawCategoria = findField(row, ['categoria']) || row['Categoria'] || '';
    const categoriaLabel = (rawCategoria || '').toString().trim() || 'Outras';
    const catKey = slugify(categoriaLabel);

    const osField = findField(row, ['os', 'os n', 'os nº', 'numero os', 'numero']) || '';
    const viatura = findField(row, ['viatura', 'veiculo', 'viagem']) || row['Viatura'] || row['Veículo'] || '';
    const status = findField(row, ['status', 'situacao', 'situação']) || row['Status'] || '';
    const note = findField(row, ['observa', 'oficina', 'empresa']) || row['Observações'] || row['Observacoes'] || '';
    const orcadaRaw = findField(row, ['orçada', 'orcada']) || row['orçada'] || row['Orçada'] || '';
    const qntRaw = findField(row, ['qnt', 'quantidade', 'qtd']) || row['qnt'] || '';

    const stage = parseStage(status);
    const details = (stage === 'pendente') ? extractPendenteDetails(status, note, orcadaRaw, qntRaw) : { orcamentos: 0, tabela: false, justificativa: false };

    return {
      id: 'sheet-' + i,
      v: (viatura || '').toString().trim(),
      os: (osField || '').toString().trim(),
      category: categoriaLabel,
      catKey: catKey,
      stage: stage,
      orcamentos: details.orcamentos,
      tabela: details.tabela,
      justificativa: details.justificativa,
      note: (note || '').toString().trim(),
    };
  }).filter(r => r.v);
}

async function fetchCsv(url){
  const response = await fetch(url);
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return await response.text();
}

async function loadData(){
  const errorArea = document.getElementById('errorArea');
  loadLocal();
  if (DATA.length) render();

  let proxyWorked = false;
  try {
    const csvText = await fetchCsv(DIRECT_SHEET_CSV_URL);
    processCsvText(csvText);
    errorArea.style.display = 'none';
    proxyWorked = true;
  } catch (e1) {
    console.warn('Falha na URL direta, tentando proxies...', e1);
    const proxies = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
      'https://api.codetabs.com/v1/proxy?quest='
    ];
    for (const p of proxies) {
      try {
        const csvText = await fetchCsv(p + encodeURIComponent(DIRECT_SHEET_CSV_URL));
        processCsvText(csvText);
        errorArea.style.display = 'none';
        proxyWorked = true;
        break;
      } catch (e2) {
        console.warn(`Proxy falhou (${p}):`, e2);
      }
    }
    if (!proxyWorked) {
      console.error('Falha ao carregar a planilha (direto e proxies).');
      renderStats();
      errorArea.style.display = 'block';
    }
  }
}

async function updateSheet(osNumber, newStatus) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'COLE_AQUI_A_URL_DO_APPS_SCRIPT') {
    console.warn('URL do Apps Script não configurada. Atualização local apenas.');
    return false;
  }
  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ os: osNumber, status: newStatus })
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.json();
    if (!result.ok) throw new Error(result.error || 'Erro desconhecido');
    return true;
  } catch (err) {
    console.error('Erro ao atualizar a planilha:', err);
    return false;
  }
}

function daysUntilParade(){
  const today = new Date();
  const startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const parade = new Date(today.getFullYear(), 8, 7);
  let target = parade;
  if (target < startToday) {
    target = new Date(today.getFullYear() + 1, 8, 7);
  }
  const diff = Math.ceil((target - startToday) / 86400000);
  return diff;
}

function stageInfo(key){ return STAGES.find(s=>s.key===key) || STAGES[0]; }

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = STAGES.map(s=>`<span><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join('') +
    `<span><span class="dot" style="background:var(--semos)"></span>Sem OS</span>`;
}

function getCategories(){
  const map = new Map();
  DATA.forEach(r => { if(r.catKey && !map.has(r.catKey)) map.set(r.catKey, r.category); });
  return Array.from(map.entries()).map(([key,label])=>({key,label}));
}

function renderTabs(){
  const cats = getCategories();
  const container = document.getElementById('tabsContainer');
  container.innerHTML = `
    <button class="tab ${activeTab === 'geral' ? 'active' : ''}" data-tab="geral" aria-label="Visão geral">Visão Geral</button>
    ${cats.map(cat => `
      <button class="tab ${activeTab === cat.key ? 'active' : ''}" data-tab="${cat.key}">${escapeHtml(cat.label)}</button>
    `).join('')}
  `;
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      activeTab = t.dataset.tab;
      render();
    });
  });
}

function matchesSearch(v, q){ return !q || (v && v.toLowerCase().includes(q.toLowerCase())); }

function pendDetailsHtml(r){
  if (r.stage !== 'pendente') return '';
  const badges = [];
  if (r.orcamentos > 0) badges.push(`<span class="badge">Orçada (${r.orcamentos})</span>`);
  if (r.tabela) badges.push(`<span class="badge">Tabela</span>`);
  if (r.justificativa) badges.push(`<span class="badge">Justificativa</span>`);
  if (badges.length === 0) badges.push(`<span class="badge">Sem detalhes</span>`);
  return `<div class="pend-details">${badges.join('')}</div>`;
}

function renderKanban(categoryKey){
  const q = document.getElementById('search').value.trim();
  const cols = STAGES.map(st=>{
    const items = DATA.filter(r=>r.catKey===categoryKey && r.stage===st.key && matchesSearch(r.v,q));
    const cards = items.length ? items.map(r=>`
      <div class="card" style="--stage-color:${st.color}">
        <div class="v">${escapeHtml(r.v)}</div>
        <div class="os">OS Nº ${escapeHtml(r.os)}</div>
        ${pendDetailsHtml(r)}
        ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ''}
        <select data-id="${r.id}" data-os="${escapeHtml(r.os)}" class="stage-select" aria-label="Alterar estágio">
          ${STAGES.map(s=>`<option value="${s.key}" ${s.key===r.stage?'selected':''}>${s.label}</option>`).join('')}
        </select>
      </div>`).join('') : `<div class="empty-col">Nenhuma OS aqui</div>`;
    return `<div class="col" style="--stage-color:${st.color}">
      <div class="col-head"><span class="t">${st.label}</span><span class="c">${items.length}</span></div>
      <div class="col-cards">${cards}</div>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = `<div class="board">${cols}</div>`;
  document.querySelectorAll('.stage-select').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const rec = DATA.find(r=>r.id===e.target.dataset.id);
      if(!rec) return;
      const oldStage = rec.stage;
      const newStage = e.target.value;
      rec.stage = newStage;
      if (newStage !== 'pendente') {
        rec.orcamentos = 0;
        rec.tabela = false;
        rec.justificativa = false;
      }
      saveLocal();
      render();
      // Enviar atualização para a planilha
      const ok = await updateSheet(rec.os, newStage);
      if (!ok) {
        alert('O status foi alterado localmente, mas falhou ao atualizar a planilha. Verifique a URL do Apps Script.');
      }
    });
  });
}

function bestRecord(v, categoryKey){
  const items = DATA.filter(r=>r.v===v && r.catKey===categoryKey);
  if(!items.length) return null;
  return items.reduce((a,b)=> STAGE_IDX[b.stage] > STAGE_IDX[a.stage] ? b : a);
}

function pillFor(rec){
  if(!rec) return `<span class="pill"><span class="dot" style="background:var(--semos)"></span>Sem OS</span>`;
  const st = stageInfo(rec.stage);
  let extra = '';
  if (rec.stage === 'pendente') {
    const parts = [];
    if (rec.orcamentos > 0) parts.push(`Orçada (${rec.orcamentos})`);
    if (rec.tabela) parts.push('Tabela');
    if (rec.justificativa) parts.push('Justificativa');
    if (parts.length) extra = ' · ' + parts.join(', ');
  }
  return `<span class="pill"><span class="dot" style="background:${st.color}"></span>${st.label}${extra} · OS ${escapeHtml(rec.os)}</span>`;
}

function renderGeral(){
  const categories = getCategories();
  const q = document.getElementById('search').value.trim();
  const allVehicles = Array.from(new Set(DATA.map(r=> (r.v||'').trim()).filter(Boolean))).filter(v=>matchesSearch(v,q));

  const gridCols = `110px repeat(${categories.length || 1}, minmax(120px,1fr))`;
  const header = `
    <div class="vg-head" style="grid-template-columns:${gridCols}">
      <span>Viatura</span>
      ${categories.map(c=>`<span>${escapeHtml(c.label)}</span>`).join('')}
    </div>`;

  const rows = allVehicles.map(v=>{
    const cells = categories.map(c=>{
      const rec = bestRecord(v,c.key);
      return `<div class="vg-cell">${pillFor(rec)}</div>`;
    }).join('');
    return `<div class="vg-row" style="grid-template-columns:${gridCols}">
      <div class="vg-v">${escapeHtml(v)}</div>
      ${cells}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = header + (rows || '<div class="empty-col">Nenhuma viatura encontrada</div>') + `
    <div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">Ordenado do menos pronto para o mais pronto — foque no topo da lista primeiro.</div>`;
}

function renderStats(){
  const categories = getCategories();
  const total = new Set(DATA.map(r=> (r.v||'').trim()).filter(Boolean)).size;
  const catStats = categories.map(c=>({n: DATA.filter(r=>r.catKey===c.key).length, l:`OS de ${c.label}`}));
  const pendentes = DATA.filter(r=>r.stage==='pendente').length;
  const aprovadas = DATA.filter(r=>r.stage==='aprovada').length;
  const finalizadas = DATA.filter(r=>r.stage==='finalizada').length;
  const canceladas = DATA.filter(r=>r.stage==='cancelada').length;
  const stats = [
    {n: total, l:'Viaturas com OS'},
    {n: pendentes, l:'Pendentes'},
    {n: aprovadas, l:'Aprovadas'},
    {n: finalizadas, l:'Finalizadas'},
    {n: canceladas, l:'Canceladas'},
    ...catStats
  ];
  document.getElementById('stats').innerHTML = stats.map(s=>`
    <div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>
  `).join('');
}

function render(){
  document.getElementById('countdownNum').textContent = daysUntilParade();
  renderLegend();
  renderStats();
  renderTabs();
  if(activeTab==='geral') renderGeral();
  else if(getCategories().some(c=>c.key===activeTab)) renderKanban(activeTab);
  else { activeTab = 'geral'; render(); }
}

function debounce(fn, wait=180){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), wait); }; }

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', debounce(()=>render(),180));

const afStageSel = document.getElementById('af-stage');
afStageSel.innerHTML = STAGES.map(s=>`<option value="${s.key}">${s.label}</option>`).join('');

document.getElementById('addBtn').addEventListener('click', ()=>{
  document.getElementById('addForm').classList.toggle('open');
});
document.getElementById('af-cancel').addEventListener('click', ()=>{
  document.getElementById('addForm').classList.remove('open');
});
document.getElementById('af-save').addEventListener('click', async ()=>{
  const v = document.getElementById('af-v').value.trim().toUpperCase();
  const os = document.getElementById('af-os').value.trim();
  const catLabel = document.getElementById('af-cat').value.trim() || 'Outras';
  const catKey = slugify(catLabel);
  const stage = document.getElementById('af-stage').value;
  const note = document.getElementById('af-note').value.trim();
  if(!v || !os){ alert('Preencha a viatura e o número da OS.'); return; }

  const duplicate = DATA.some(r => r.v.toUpperCase() === v && r.catKey === catKey);
  if(duplicate){
    alert(`Já existe uma OS para a viatura ${v} na categoria ${catLabel}.`);
    return;
  }

  const newRecord = {id:'r'+Date.now(), v, os, category:catLabel, catKey, stage, note};
  if (stage === 'pendente') {
    newRecord.orcamentos = 0;
    newRecord.tabela = false;
    newRecord.justificativa = false;
  }
  DATA.push(newRecord);
  saveLocal();
  document.getElementById('af-v').value=''; document.getElementById('af-os').value=''; document.getElementById('af-cat').value=''; document.getElementById('af-note').value='';
  document.getElementById('addForm').classList.remove('open');
  render();

  // Enviar para a planilha? A adição de nova OS não está prevista para atualizar a planilha,
  // pois exigiria escrever em uma nova linha. Por enquanto, apenas atualizamos localmente.
  // Se quiser, pode implementar no Apps Script uma função para adicionar linhas.
});

document.getElementById('csvFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const csvText = ev.target.result;
    processCsvText(csvText);
    document.getElementById('errorArea').style.display = 'none';
  };
  reader.readAsText(file);
});

loadData();
</script>
